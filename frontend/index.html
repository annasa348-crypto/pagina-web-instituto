<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h3 class="text-center mb-4">Instituto</h3>

            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input id="usuario" class="form-control" required>
                <div class="invalid-feedback">Ingresá tu usuario.</div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" type="password" class="form-control" required>
                <div class="invalid-feedback">Ingresá tu contraseña.</div>
              </div>

              <button class="btn btn-primary w-100">Ingresar</button>
            </form>

            <div id="errorLogin" class="alert alert-danger d-none mt-3 mb-0"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Instituto</span>
    <div class="text-white">
      <span id="infoUsuario" class="me-3"></span>
      <button id="btnSalir" class="btn btn-light btn-sm">Salir</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h4 class="mb-3">Bienvenida/o</h4>
    <div id="menu" class="row g-3"></div>
  </div>

  <script>
    const sesion = JSON.parse(sessionStorage.getItem("sesion"));

    if (!sesion) {
      window.location.href = "index.html";
    }

    // Pantallas conectadas con el backend, según el rol (coincide con los permisos de la API)
    const OPCIONES = [
      { titulo: "Alumnos",        archivo: "alumnos.html",     roles: ["ADMINISTRADOR", "ADMINISTRATIVO", "DOCENTE"] },
      { titulo: "Inscripción",    archivo: "inscripcion.html", roles: ["ADMINISTRADOR", "ADMINISTRATIVO"] },
      { titulo: "Cuotas y pagos", archivo: "pagos.html",       roles: ["ADMINISTRADOR", "ADMINISTRATIVO"] }
      // Pendientes de conectar (el backend todavía no tiene evaluaciones, notas ni asistencias):
      // { titulo: "Notas y asistencias",    archivo: "notas.html",  roles: ["ADMINISTRADOR", "DOCENTE"] },
      // { titulo: "Mi situación académica", archivo: "alumno.html", roles: ["ALUMNO"] }
    ];

    document.getElementById("infoUsuario").textContent =
      (sesion.nombre || sesion.usuario) + " (" + sesion.rol + ")";

    const menu = document.getElementById("menu");
    OPCIONES.filter(o => o.roles.includes(sesion.rol)).forEach(o => {
      menu.innerHTML += `
        <div class="col-md-4">
          <a href="${o.archivo}" class="text-decoration-none">
            <div class="card shadow-sm h-100">
              <div class="card-body text-center py-4">
                <h5 class="card-title mb-0">${o.titulo}</h5>
              </div>
            </div>
          </a>
        </div>`;
    });

    document.getElementById("btnSalir").addEventListener("click", function () {
      sessionStorage.removeItem("sesion");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>

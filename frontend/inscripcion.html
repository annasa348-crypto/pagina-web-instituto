<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscripción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Instituto</span>
    <a href="dashboard.html" class="btn btn-light btn-sm">Volver al panel</a>
  </nav>

  <div class="container mt-4">
    <h4 class="mb-3">Inscripción a cursos</h4>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form id="formInscripcion" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Alumno</label>
              <select id="selAlumno" class="form-select" required></select>
              <div class="invalid-feedback">Elegí un alumno.</div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Ciclo lectivo</label>
              <select id="selCiclo" class="form-select" required></select>
              <div class="invalid-feedback">Elegí un ciclo.</div>
            </div>
            <div class="col-md-5">
              <label class="form-label">Curso</label>
              <select id="selCurso" class="form-select" required></select>
              <div class="invalid-feedback">Elegí un curso.</div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary mt-3">Inscribir</button>
        </form>
        <div id="mensaje" class="mt-3"></div>
      </div>
    </div>

    <h5>Cupos por curso</h5>
    <div class="table-responsive mb-4">
      <table class="table bg-white shadow-sm">
        <thead class="table-dark">
          <tr><th>Curso</th><th>Ciclo</th><th>Inscriptos</th><th>Capacidad</th><th>Estado</th></tr>
        </thead>
        <tbody id="tablaCupos"></tbody>
      </table>
    </div>

    <h5>Inscripciones registradas</h5>
    <div class="table-responsive">
      <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
          <tr><th>Alumno</th><th>DNI</th><th>Curso</th><th>Ciclo</th><th>Fecha</th></tr>
        </thead>
        <tbody id="tablaInscripciones"></tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Seguridad: solo ADMINISTRADOR y ADMINISTRATIVO
    const sesion = getSesion();
    if (!sesion || !["ADMINISTRADOR", "ADMINISTRATIVO"].includes(sesion.rol)) {
      window.location.href = "index.html";
    }

    // Datos que vienen del backend
    let alumnos = [];
    let ciclos = [];
    let cursos = [];
    let inscripciones = [];

    const selAlumno = document.getElementById("selAlumno");
    const selCiclo = document.getElementById("selCiclo");
    const selCurso = document.getElementById("selCurso");
    const form = document.getElementById("formInscripcion");

    const fecha = f => f ? f.split("-").reverse().join("/") : "-";

    function mensaje(texto, tipo) {
      document.getElementById("mensaje").innerHTML =
        texto ? `<div class="alert alert-${tipo} mb-0">${esc(texto)}</div>` : "";
    }

    async function cargarDatos() {
      try {
        [alumnos, ciclos, cursos] = await Promise.all([
          api("/api/alumnos"),
          api("/api/ciclos-lectivos"),
          api("/api/cursos")
        ]);
        // No existe un endpoint "todas las inscripciones": se piden por curso y se juntan
        const listas = await Promise.all(cursos.map(c => api("/api/inscripciones/curso/" + c.id)));
        inscripciones = listas.flat().sort((a, b) => b.id - a.id);
        cargarSelects();
        mostrarTablas();
      } catch (e) {
        mensaje(e.message, "danger");
      }
    }

    function cargarSelects() {
      const alumnoElegido = selAlumno.value;
      const cicloElegido = selCiclo.value;

      selAlumno.innerHTML = '<option value="">Seleccionar...</option>' +
        alumnos.map(a => `<option value="${a.id}">${esc(a.apellido)}, ${esc(a.nombre)} (${esc(a.dni)})</option>`).join("");
      selCiclo.innerHTML = '<option value="">Seleccionar...</option>' +
        ciclos.map(c => `<option value="${c.id}">${c.anio}</option>`).join("");

      selAlumno.value = alumnoElegido;
      selCiclo.value = cicloElegido;
      cargarCursos();
    }

    function cargarCursos() {
      const cicloId = Number(selCiclo.value);
      selCurso.innerHTML = '<option value="">Seleccionar...</option>' +
        cursos.filter(c => c.cicloLectivoId === cicloId)
              .map(c => `<option value="${c.id}">${esc(c.nombre)} (cupos: ${c.cuposDisponibles})</option>`).join("");
    }

    function mostrarTablas() {
      // Cupos: los datos (inscriptos, capacidad) los calcula el backend
      document.getElementById("tablaCupos").innerHTML = cursos.length
        ? cursos.map(c => {
            const lleno = c.cuposDisponibles === 0;
            return `
              <tr>
                <td>${esc(c.nombre)}</td>
                <td>${c.anio}</td>
                <td>${c.inscriptos}</td>
                <td>${c.capacidadMaxima}</td>
                <td><span class="badge ${lleno ? "bg-danger" : "bg-success"}">${lleno ? "COMPLETO" : "CON CUPO"}</span></td>
              </tr>`;
          }).join("")
        : '<tr><td colspan="5" class="text-center text-muted">No hay cursos cargados.</td></tr>';

      // Inscripciones registradas
      document.getElementById("tablaInscripciones").innerHTML = inscripciones.length
        ? inscripciones.map(i => `
            <tr>
              <td>${esc(i.alumno.apellido)}, ${esc(i.alumno.nombre)}</td>
              <td>${esc(i.alumno.dni)}</td>
              <td>${esc(i.curso.nombre)}</td>
              <td>${i.curso.cicloLectivo.anio}</td>
              <td>${fecha(i.fecha)}</td>
            </tr>`).join("")
        : '<tr><td colspan="5" class="text-center text-muted">Todavía no hay inscripciones.</td></tr>';
    }

    selCiclo.addEventListener("change", cargarCursos);

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      mensaje("", "");

      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      try {
        // Las reglas (cupo, duplicados, un alumno por ciclo, alumno activo) las valida el backend
        await api("/api/inscripciones", {
          method: "POST",
          body: JSON.stringify({ alumnoId: Number(selAlumno.value), cursoId: Number(selCurso.value) })
        });
        form.classList.remove("was-validated");
        form.reset();
        await cargarDatos();
        mensaje("Inscripción registrada correctamente.", "success");
      } catch (err) {
        mensaje(err.message, "danger");
      }
    });

    cargarDatos();
  </script>
</body>
</html>

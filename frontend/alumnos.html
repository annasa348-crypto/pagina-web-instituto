<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alumnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">Instituto</span>
    <a href="dashboard.html" class="btn btn-light btn-sm">Volver al panel</a>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Alumnos</h4>
      <button id="btnNuevo" class="btn btn-primary" onclick="abrirFormulario()">Nuevo alumno</button>
    </div>

    <div id="aviso"></div>

    <input id="buscador" class="form-control mb-3" placeholder="Buscar por DNI, apellido o nombre">

    <div class="table-responsive">
      <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
          <tr>
            <th>DNI</th><th>Apellido</th><th>Nombre</th><th>Email</th><th>Estado</th><th></th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  </div>

  <!-- Formulario -->
  <div class="modal fade" id="modalAlumno" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formAlumno" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModal">Nuevo alumno</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="idAlumno">
            <div class="mb-2">
              <label class="form-label">DNI</label>
              <input id="dni" class="form-control" required pattern="[0-9]{7,8}">
              <div class="invalid-feedback">DNI de 7 u 8 números.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Apellido</label>
              <input id="apellido" class="form-control" required minlength="2">
              <div class="invalid-feedback">Ingresá el apellido.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Nombre</label>
              <input id="nombre" class="form-control" required minlength="2">
              <div class="invalid-feedback">Ingresá el nombre.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input id="email" type="email" class="form-control" required>
              <div class="invalid-feedback">Email no válido.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Fecha de nacimiento</label>
              <input id="fechaNacimiento" type="date" class="form-control" required>
              <div class="invalid-feedback">Ingresá una fecha de nacimiento anterior a hoy.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Domicilio <span class="text-muted small">(opcional)</span></label>
              <input id="domicilio" class="form-control" maxlength="150">
            </div>
            <div class="mb-2">
              <label class="form-label">Teléfono <span class="text-muted small">(opcional)</span></label>
              <input id="telefono" class="form-control" maxlength="30">
            </div>
            <div id="errorForm" class="text-danger small"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Seguridad: los tres roles pueden ver; solo ADMINISTRADOR y ADMINISTRATIVO modifican
    const sesion = getSesion();
    if (!sesion) {
      window.location.href = "index.html";
    }
    const puedeEditar = ["ADMINISTRADOR", "ADMINISTRATIVO"].includes(sesion.rol);
    if (!puedeEditar) {
      document.getElementById("btnNuevo").style.display = "none";
    }

    let alumnos = [];

    function aviso(texto, tipo) {
      document.getElementById("aviso").innerHTML =
        texto ? `<div class="alert alert-${tipo}">${esc(texto)}</div>` : "";
    }

    // Trae los alumnos desde el backend (con búsqueda opcional)
    async function cargar() {
      try {
        const q = document.getElementById("buscador").value.trim();
        alumnos = await api("/api/alumnos" + (q ? "?q=" + encodeURIComponent(q) : ""));
        aviso("");
        mostrar();
      } catch (e) {
        aviso(e.message, "danger");
      }
    }

    function mostrar() {
      const tbody = document.getElementById("tabla");
      if (alumnos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No hay alumnos para mostrar.</td></tr>';
        return;
      }
      tbody.innerHTML = alumnos.map(a => `
        <tr>
          <td>${esc(a.dni)}</td>
          <td>${esc(a.apellido)}</td>
          <td>${esc(a.nombre)}</td>
          <td>${esc(a.email)}</td>
          <td><span class="badge ${a.estado === "ACTIVO" ? "bg-success" : "bg-secondary"}">${esc(a.estado)}</span></td>
          <td class="text-end">
            ${puedeEditar ? `
              <button class="btn btn-sm btn-outline-primary" onclick="editar(${a.id})">Editar</button>
              <button class="btn btn-sm btn-outline-danger" onclick="darDeBaja(${a.id})">Baja</button>` : ""}
          </td>
        </tr>`).join("");
    }

    const modal = new bootstrap.Modal(document.getElementById("modalAlumno"));
    const form = document.getElementById("formAlumno");
    const hoy = new Date().toLocaleDateString("sv-SE");   // AAAA-MM-DD
    document.getElementById("fechaNacimiento").max = hoy;

    function abrirFormulario() {
      form.reset();
      form.classList.remove("was-validated");
      document.getElementById("errorForm").textContent = "";
      document.getElementById("idAlumno").value = "";
      document.getElementById("tituloModal").textContent = "Nuevo alumno";
      modal.show();
    }

    function editar(id) {
      const a = alumnos.find(x => x.id === id);
      abrirFormulario();
      document.getElementById("tituloModal").textContent = "Editar alumno";
      document.getElementById("idAlumno").value = a.id;
      document.getElementById("dni").value = a.dni;
      document.getElementById("apellido").value = a.apellido;
      document.getElementById("nombre").value = a.nombre;
      document.getElementById("email").value = a.email || "";
      document.getElementById("fechaNacimiento").value = a.fechaNacimiento || "";
      document.getElementById("domicilio").value = a.domicilio || "";
      document.getElementById("telefono").value = a.telefono || "";
    }

    // Baja lógica: el backend marca al alumno como INACTIVO (no lo borra)
    async function darDeBaja(id) {
      if (!confirm("¿Dar de baja a este alumno?")) return;
      try {
        await api("/api/alumnos/" + id, { method: "DELETE" });
        await cargar();
      } catch (e) {
        aviso(e.message, "danger");
      }
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      document.getElementById("errorForm").textContent = "";
      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const id = document.getElementById("idAlumno").value;
      const datos = {
        dni: document.getElementById("dni").value.trim(),
        apellido: document.getElementById("apellido").value.trim(),
        nombre: document.getElementById("nombre").value.trim(),
        email: document.getElementById("email").value.trim(),
        fechaNacimiento: document.getElementById("fechaNacimiento").value,
        domicilio: document.getElementById("domicilio").value.trim() || null,
        telefono: document.getElementById("telefono").value.trim() || null
      };

      try {
        if (id) {
          await api("/api/alumnos/" + id, { method: "PUT", body: JSON.stringify(datos) });
        } else {
          await api("/api/alumnos", { method: "POST", body: JSON.stringify(datos) });
        }
        modal.hide();
        await cargar();
      } catch (err) {
        // 400 (datos inválidos) o 409 (DNI repetido): el mensaje viene del backend
        document.getElementById("errorForm").textContent = err.message;
      }
    });

    let temporizador;
    document.getElementById("buscador").addEventListener("input", function () {
      clearTimeout(temporizador);
      temporizador = setTimeout(cargar, 300);
    });

    cargar();
  </script>
</body>
</html>
